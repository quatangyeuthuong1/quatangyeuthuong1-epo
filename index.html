<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Món Quà Cuộc Sống</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0f0;
    cursor: none;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  #stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  #gift-selection {
    display: grid;
    grid-template-columns: repeat(4, 125px);
    gap: 18px;
    max-width: 90vw;
  }
  #reveal-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: min(90vw, 620px);
    padding: 24px;
    border: 2px solid #900;
    background: rgba(20, 0, 0, 0.9);
    box-shadow: 0 0 30px #600;
  }
  #reveal-panel[hidden] {
    display: none;
  }
  .gift-choice {
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .gift-choice:hover .gift,
  .gift-choice:focus-visible .gift {
    filter: brightness(1.5);
  }
  .gift {
    width: 125px;
    height: 125px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  .flicker { animation: flick 0.1s infinite; }
  @keyframes flick {
    0%,100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  .scary {
    font-size: 60px;
    color: #f00;
    text-shadow: 0 0 20px #f00;
    animation: shake 0.08s infinite;
  }
  .scary-image {
    width: min(78vw, 68vh, 560px);
    height: min(78vw, 68vh, 560px);
    object-fit: contain;
    filter: contrast(1.35) saturate(1.25) drop-shadow(0 0 24px #f00);
    animation: image-shake 0.08s infinite;
  }
  @keyframes image-shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-4px, 3px) rotate(-1deg); }
    50% { transform: translate(4px, -3px) rotate(1deg); }
    75% { transform: translate(-2px, -2px) rotate(-1deg); }
  }
  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-5px,3px); }
    50% { transform: translate(4px,-4px); }
    75% { transform: translate(-3px,-2px); }
    100% { transform: translate(3px,4px); }
  }
  @media (max-width: 600px) {
    body { cursor: auto; }
    #gift-selection {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(92vw, 280px);
    }
    .gift {
      width: min(28vw, 120px);
      height: min(28vw, 120px);
    }
    #reveal-panel {
      width: 94vw;
      padding: 12px;
      gap: 12px;
    }
    .scary {
      font-size: 34px;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }
    .scary-image {
      width: min(82vw, 62dvh, 560px);
      height: min(82vw, 62dvh, 560px);
    }
  }
  @media (max-width: 600px) and (orientation: portrait) {
    .scary-image {
      width: min(86vw, 360px);
      height: min(86vw, 360px);
    }
  }
  @media (max-width: 360px) {
    #gift-selection { width: 230px; gap: 8px; }
    .gift {
      width: 105px;
      height: 105px;
    }
    .scary { font-size: 28px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    #gift-selection { grid-template-columns: repeat(4, 1fr); width: 92vw; gap: 8px; }
    .gift { width: min(20vw, 95px); height: min(20vw, 95px); }
    .scary-image { width: min(42vw, 58dvh, 420px); height: min(42vw, 58dvh, 420px); }
    .scary { font-size: 30px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="gift-selection" aria-label="Chọn một hộp quà"></div>
  <div id="reveal-panel" hidden>
    <img class="gift" id="content" alt="Hộp quà bí ẩn" hidden src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Crect width='160' height='160' rx='18' fill='%23101010'/%3E%3Cpath d='M25 70h110v65H25zM18 55h124v25H18zM72 55v80M80 55v80' fill='%23900' stroke='%23f33' stroke-width='5'/%3E%3Cpath d='M80 55c-35 10-42-25-20-25 13 0 20 13 20 25zm0 0c35 10 42-25 20-25-13 0-20 13-20 25z' fill='%23d22' stroke='%23f66' stroke-width='4'/%3E%3C/svg%3E">
    <div id="message" class="scary" hidden></div>
  </div>
</div>

<script>
// Danh sách các kịch bản hù khác nhau
const scares = [
  { text: "bảo đang ...", image: "face", sound: true },
  { text: "khang có gay hok?", image: "eyes", sound: true },
  { text: "PHÍA SAU NGƯƠI Kìa Chính", image: "skull", sound: true },
  { text: "TRường đang mèo méo meo", image: "ghost", sound: true },
  { text: "CHẠY ĐI... huy ơi", image: "spider", sound: true },
  { text: "MỞ CỬA RA...KHANG đến kìa meo", image: "door", sound: true },
  { text: "12 GIỜ ĐÊM NAY...", image: "clock", sound: true },
  { text: "NGƯƠI SẼ KHÔNG NGỦ ĐƯỢC", image: "moon", sound: true }
];

const scaryImages = {
  face: "anh-kinh-di.jpg",
  eyes: "anh-ma.jpg",
  skull: "chi-phien-meme-15.jpg",
  ghost: "hinh-anh-ma-kinh-di-3d.jpg",
  spider: "pikachu-meme-2.jpg",
  door: "chi-phien-meme-8.jpg",
  clock: "pikachu-meme-6.jpg",
  moon: "pikachu-meme-34.jpg"
};

const content = document.getElementById('content');
const message = document.getElementById('message');
const stage = document.getElementById('stage');
const giftSelection = document.getElementById('gift-selection');
const revealPanel = document.getElementById('reveal-panel');
const giftImage = content.src;
const laughSound = new Audio('https://tiengdong.com/wp-content/uploads/cau-noi-viral-tieng-cuoi-hahaha-bac-gau-vlog-www_tiengdong_com.mp3');
laughSound.loop = true;

scares.forEach((scare, index) => {
  const button = document.createElement('button');
  const gift = document.createElement('img');

  button.className = 'gift-choice';
  button.type = 'button';
  button.setAttribute('aria-label', `Mở hộp quà số ${index + 1}`);
  gift.className = 'gift';
  gift.alt = `Hộp quà số ${index + 1}`;
  gift.src = giftImage;
  button.appendChild(gift);
  button.addEventListener('click', () => revealScare(scare));
  giftSelection.appendChild(button);
});

// Âm thanh rùng rợn bằng Web Audio API (không cần file ngoài)
function playScarySound() {
  laughSound.currentTime = 0;
  laughSound.play().catch(() => {});
}

function revealScare(scare) {
  giftSelection.replaceChildren();
  giftSelection.hidden = true;
  revealPanel.hidden = false;
  content.src = scaryImages[scare.image];
  content.alt = scare.text;
  content.className = 'scary-image';
  content.style.opacity = '1';
  content.hidden = false;
  message.textContent = scare.text;
  message.className = 'scary';
  message.hidden = false;
  stage.style.background = '#300';
  playScarySound();

  // Giữ ảnh rõ ràng một lúc trước khi bắt đầu hiệu ứng nhấp nháy.
  setTimeout(() => {
    document.body.classList.add('flicker');

    let count = 0;
    setInterval(() => {
      if (count % 2 === 0) {
        content.style.opacity = '1';
        message.className = 'scary';
        stage.style.background = '#300';
      } else {
        content.style.opacity = '0.35';
        message.className = 'scary flicker';
        stage.style.background = '#000';
      }
      count++;
    }, 120);
  }, 2500);
}
</script>
</body>
</html>
